<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triángulo del Desarrollo</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.05); }
    }
    .animate-glow {
      animation: pulseGlow 4s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen h-[100dvh] flex flex-col justify-between items-center p-3 sm:p-6 select-none overflow-y-auto">

  <!-- Glow de fondo dinámico -->
  <div id="ambientGlow" class="fixed inset-0 pointer-events-none transition-all duration-700 opacity-20 bg-gradient-to-tr from-purple-950 via-slate-950 to-blue-950"></div>

  <div class="relative z-10 w-full max-w-sm flex-1 flex flex-col justify-between my-auto py-1">

    <!-- Encabezado compacto -->
    <header class="text-center mb-2">
      <div class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-purple-400 text-xs font-medium mb-1">
        <i data-lucide="sparkles" class="w-3 h-3"></i>
        <span>Regla de los 3 Parámetros</span>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-slate-100">Triángulo del Desarrollo</h1>
      <p class="text-[11px] text-slate-400 mt-0.5">Elige máximo 2 características para tu proyecto</p>
    </header>

    <!-- Contenedor de Switches (Selección de Parámetros) -->
    <main class="space-y-2">

      <!-- Opción 1: Rápido -->
      <label class="group relative flex items-center justify-between p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 transition-all duration-200 cursor-pointer shadow-sm active:scale-[0.99]">
        <input type="checkbox" id="fast" value="fast" class="sr-only peer" onchange="toggleOption('fast')">
        <div class="flex items-center gap-2.5">
          <div class="p-1.5 rounded-lg bg-pink-500/10 text-pink-400 group-hover:scale-105 transition-transform">
            <i data-lucide="zap" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="font-semibold text-slate-200 text-sm leading-tight">Rápido</div>
            <div class="text-[10px] text-slate-400">Entrega en tiempo récord</div>
          </div>
        </div>
        <!-- Toggle Switch -->
        <div class="w-9 h-5 bg-slate-800 rounded-full peer peer-checked:bg-pink-500 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-3 after:right-4 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all shadow-inner"></div>
      </label>

      <!-- Opción 2: Bueno -->
      <label class="group relative flex items-center justify-between p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 transition-all duration-200 cursor-pointer shadow-sm active:scale-[0.99]">
        <input type="checkbox" id="good" value="good" class="sr-only peer" onchange="toggleOption('good')">
        <div class="flex items-center gap-2.5">
          <div class="p-1.5 rounded-lg bg-blue-500/10 text-blue-400 group-hover:scale-105 transition-transform">
            <i data-lucide="award" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="font-semibold text-slate-200 text-sm leading-tight">Bueno</div>
            <div class="text-[10px] text-slate-400">Máxima calidad e innovación</div>
          </div>
        </div>
        <!-- Toggle Switch -->
        <div class="w-9 h-5 bg-slate-800 rounded-full peer peer-checked:bg-blue-500 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-3 after:right-4 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all shadow-inner"></div>
      </label>

      <!-- Opción 3: Barato -->
      <label class="group relative flex items-center justify-between p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-slate-700 transition-all duration-200 cursor-pointer shadow-sm active:scale-[0.99]">
        <input type="checkbox" id="cheap" value="cheap" class="sr-only peer" onchange="toggleOption('cheap')">
        <div class="flex items-center gap-2.5">
          <div class="p-1.5 rounded-lg bg-emerald-500/10 text-emerald-400 group-hover:scale-105 transition-transform">
            <i data-lucide="piggy-bank" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="font-semibold text-slate-200 text-sm leading-tight">Barato</div>
            <div class="text-[10px] text-slate-400">Costo mínimo posible</div>
          </div>
        </div>
        <!-- Toggle Switch -->
        <div class="w-9 h-5 bg-slate-800 rounded-full peer peer-checked:bg-emerald-500 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-3 after:right-4 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all shadow-inner"></div>
      </label>

    </main>

    <!-- Caja de Resultado Diagnóstico -->
    <section id="resultCard" class="mt-3 p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 text-center transition-all duration-300 shadow-lg relative overflow-hidden flex flex-col justify-center items-center min-h-[120px]">
      <div id="resultIcon" class="w-8 h-8 rounded-full flex items-center justify-center bg-slate-800 text-slate-400 mb-1.5">
        <i data-lucide="mouse-pointer-click" class="w-4 h-4"></i>
      </div>
      <h2 id="resultTitle" class="text-base font-bold text-slate-300">Selecciona 2 opciones</h2>
      <p id="resultDesc" class="text-[11px] text-slate-400 mt-0.5 leading-snug max-w-[240px]">
        Elige dos características para conocer la consecuencia de tu proyecto.
      </p>
    </section>

    <!-- Footer -->
    <footer class="text-center mt-2 text-[10px] text-slate-500">
      Triángulo del desarrollo &copy; Paradoja del Software
    </footer>

  </div>

  <script>
    // Lucide Icons Init
    lucide.createIcons();

    // Cola de opciones activas (máximo 2)
    let selectedQueue = [];

    // Mapeo de resultados
    const outcomes = {
      // Barato + Rápido = MALO
      'cheap,fast': {
        title: 'MALO',
        desc: 'Al requerir rapidez y bajo costo, el código será propenso a errores y poco sostenible.',
        icon: 'skull',
        colorClass: 'text-rose-400',
        bgClass: 'bg-rose-500/10',
        borderClass: 'border-rose-500/30',
        glow: 'from-rose-950 via-slate-950 to-slate-950'
      },
      // Bueno + Rápido = CARO
      'fast,good': {
        title: 'CARO',
        desc: 'Para ofrecer máxima calidad en tiempo récord, requerirá más recursos y presupuesto alto.',
        icon: 'dollar-sign',
        colorClass: 'text-amber-400',
        bgClass: 'bg-amber-500/10',
        borderClass: 'border-amber-500/30',
        glow: 'from-amber-950 via-slate-950 to-slate-950'
      },
      // Barato + Bueno = LENTO
      'cheap,good': {
        title: 'LENTO',
        desc: 'Un producto excelente a bajo precio tomará mucho más tiempo en desarrollarse.',
        icon: 'hourglass',
        colorClass: 'text-sky-400',
        bgClass: 'bg-sky-500/10',
        borderClass: 'border-sky-500/30',
        glow: 'from-sky-950 via-slate-950 to-slate-950'
      }
    };

    function toggleOption(id) {
      const checkbox = document.getElementById(id);

      if (checkbox.checked) {
        selectedQueue.push(id);
        // Regla de máximo 2: si hay más de 2, desmarca el más antiguo (FIFO)
        if (selectedQueue.length > 2) {
          const removedId = selectedQueue.shift();
          document.getElementById(removedId).checked = false;
        }
      } else {
        selectedQueue = selectedQueue.filter(item => item !== id);
      }

      updateUI();
    }

    function updateUI() {
      const card = document.getElementById('resultCard');
      const iconContainer = document.getElementById('resultIcon');
      const title = document.getElementById('resultTitle');
      const desc = document.getElementById('resultDesc');
      const glow = document.getElementById('ambientGlow');

      // Si tenemos exactamente 2 opciones seleccionadas
      if (selectedQueue.length === 2) {
        // Orden alfabético para coincidir con la clave del objeto
        const key = [...selectedQueue].sort().join(',');
        const result = outcomes[key];

        if (result) {
          title.textContent = result.title;
          title.className = `text-base font-black tracking-wide ${result.colorClass}`;

          desc.textContent = result.desc;
          desc.className = "text-[11px] text-slate-300 mt-0.5 leading-snug max-w-[240px]";

          iconContainer.className = `w-8 h-8 rounded-full flex items-center justify-center ${result.bgClass} ${result.colorClass} mb-1.5`;
          iconContainer.innerHTML = `<i data-lucide="${result.icon}" class="w-4 h-4"></i>`;

          card.className = `mt-3 p-3.5 rounded-2xl bg-slate-900/90 border ${result.borderClass} text-center transition-all duration-300 shadow-xl relative overflow-hidden flex flex-col justify-center items-center min-h-[120px]`;

          glow.className = `fixed inset-0 pointer-events-none transition-all duration-700 opacity-40 bg-gradient-to-tr ${result.glow}`;
        }
      } 
      // Si hay solo 1 opción seleccionada
      else if (selectedQueue.length === 1) {
        title.textContent = 'Selecciona 1 más';
        title.className = 'text-base font-bold text-slate-300';

        desc.textContent = 'Elige una segunda opción para completar la prueba.';
        desc.className = "text-[11px] text-slate-400 mt-0.5 leading-snug max-w-[240px]";

        iconContainer.className = 'w-8 h-8 rounded-full flex items-center justify-center bg-purple-500/10 text-purple-400 mb-1.5';
        iconContainer.innerHTML = `<i data-lucide="plus-circle" class="w-4 h-4"></i>`;

        card.className = 'mt-3 p-3.5 rounded-2xl bg-slate-900/90 border border-purple-500/20 text-center transition-all duration-300 shadow-lg relative overflow-hidden flex flex-col justify-center items-center min-h-[120px]';

        glow.className = 'fixed inset-0 pointer-events-none transition-all duration-700 opacity-20 bg-gradient-to-tr from-purple-950 via-slate-950 to-slate-950';
      } 
      // 0 opciones seleccionadas
      else {
        title.textContent = 'Selecciona 2 opciones';
        title.className = 'text-base font-bold text-slate-300';

        desc.textContent = 'Elige dos características para conocer la consecuencia de tu proyecto.';
        desc.className = "text-[11px] text-slate-400 mt-0.5 leading-snug max-w-[240px]";

        iconContainer.className = 'w-8 h-8 rounded-full flex items-center justify-center bg-slate-800 text-slate-400 mb-1.5';
        iconContainer.innerHTML = `<i data-lucide="mouse-pointer-click" class="w-4 h-4"></i>`;

        card.className = 'mt-3 p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 text-center transition-all duration-300 shadow-lg relative overflow-hidden flex flex-col justify-center items-center min-h-[120px]';

        glow.className = 'fixed inset-0 pointer-events-none transition-all duration-700 opacity-20 bg-gradient-to-tr from-purple-950 via-slate-950 to-blue-950';
      }

      // Re-renderizar iconos dinámicos creados
      lucide.createIcons();
    }
  </script>
</body>
</html>
